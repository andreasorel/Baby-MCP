[project]
name = "baby-mcp"
version = "0.1.0"
description = "MCP server: reliable baby/pregnancy guidance from Norwegian health authorities only"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andreas Ore Larssen" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "norway", "helsenorge", "helsedirektoratet", "fhi", "baby", "pregnancy", "health", "claude"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Natural Language :: Norwegian",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["mcp>=1.2,<2", "python-dotenv>=1.0", "httpx>=0.27", "beautifulsoup4>=4.12"]

[project.urls]
Homepage = "https://github.com/andreasorel/Baby-MCP"
Issues = "https://github.com/andreasorel/Baby-MCP/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
baby-mcp = "baby_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baby_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
