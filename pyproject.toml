[project]
name = "baby-mcp"
version = "0.1.0"
description = "MCP server: reliable baby/pregnancy guidance from Norwegian health authorities only"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "python-dotenv>=1.0", "httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
baby-mcp = "baby_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baby_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
